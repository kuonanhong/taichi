<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聰動字幕校對｜國台語混合</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f4fa;color:#302941;font:20px/1.65 system-ui}main{max-width:1300px;margin:auto;padding:24px}header{background:#56308b;color:white;padding:24px}h1{font-size:30px}select,button,input,textarea{font:inherit}select,audio,textarea{width:100%}select,textarea,input{padding:10px;border:1px solid #c9bfd8;border-radius:7px}button{border:0;border-radius:8px;padding:10px 16px;margin:5px;background:#56308b;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}.panel{padding:20px;margin:20px 0;background:white;border-radius:12px;border:1px solid #ded8e7}.note{background:#fff4d6;padding:14px;border-radius:8px}.row{border-top:1px solid #ddd;padding:18px 0}.times{display:flex;gap:12px;flex-wrap:wrap}.times label{flex:1;min-width:180px}label{display:block}textarea{min-height:100px;resize:vertical}.en{color:#665a74}#clock{font-variant-numeric:tabular-nums}#saveState{font-size:16px;color:#665a74}a{color:#56308b}.buttons{display:flex;gap:10px;flex-wrap:wrap}#message{padding:12px}body,pre{overflow-wrap:anywhere}pre{white-space:pre-wrap;font:inherit}</style></head>
<body><header><h1>聰動字幕校對｜國語、台語混合</h1><p>先確認中文原意，再製作英文字幕；沿用現有 YouTube 影片網址。</p></header><main>
<p class="note">本頁只在本機運作。請聽原音、校正中文與時間碼；英文可留白，交由後續翻譯。尚未核對的文字不會送到 YouTube。</p>
<section class="panel"><label for="clip">選擇短片</label><select id="clip"></select><p id="title"></p><audio id="audio" controls preload="metadata"></audio><p>目前播放：<b id="clock">0.000</b> 秒 <button id="slower">0.8 倍慢速</button><button id="normal">正常速度</button></p><a id="youtube" target="_blank" rel="noopener">開啟原 YouTube 影片</a><details><summary>AI 辨識參考（已發現錯字，需依原音核對）</summary><pre id="raw"></pre></details></section>
<section class="panel"><h2>逐句校對</h2><p>可將一句拆成多列；播放到句子開頭或結尾時，按「取目前時間」。</p><div id="rows"></div><button id="add">新增一句</button><p><label><input type="checkbox" id="confirmed" style="width:auto"> 我已聽原音並核對這支影片的中文及時間碼</label></p><p id="saveState"></p><div class="buttons"><button id="export">下載校對紀錄 JSON</button><button id="srt" disabled>下載已確認中文字幕 SRT</button><button id="english" disabled>下載英文 SRT</button></div><p id="message" role="status"></p></section></main>
<script>
let playUntil=null;let data, current, audio=document.querySelector('#audio');
const el=id=>document.getElementById(id), storageKey='smartaction-caption-review-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
const stamp=t=>{let n=Math.round(t*1000),h=Math.floor(n/3600000);n%=3600000;let m=Math.floor(n/60000);n%=60000;return [h,m,Math.floor(n/1000)].map(v=>String(v).padStart(2,'0')).join(':')+','+String(n%1000).padStart(3,'0')};
function store(){try{localStorage.setItem(storageKey,JSON.stringify(saved));el('saveState').textContent='修改已暫存在此瀏覽器；請下載 JSON 留存。'}catch{el('saveState').textContent='請下載 JSON 保存修改。'}}
function state(){return saved[current.videoId]}
function updateButtons(){el('srt').disabled=!state().chineseReviewed;el('english').disabled=!state().chineseReviewed||!state().cues.every(c=>c.en.trim())}
function change(){state().chineseReviewed=false;el('confirmed').checked=false;store();updateButtons()}
function renderRows(){el('rows').replaceChildren();state().cues.forEach((cue,i)=>{let row=document.createElement('div');row.className='row';row.innerHTML='<b>第 '+(i+1)+' 句</b><div class="times"><label>開始（秒）<input type="number" min="0" step="0.001" data-k="start"><button data-time="start">取目前時間</button></label><label>結束（秒）<input type="number" min="0" step="0.001" data-k="end"><button data-time="end">取目前時間</button></label></div><label>繁體中文<textarea data-k="zh" placeholder="請依原音填入中文；聽不清楚處可先標記待確認"></textarea></label><label>English（中文確認後再翻譯）<textarea data-k="en"></textarea></label><button data-play>播放這一句</button><button data-remove>刪除此句</button>';
row.querySelectorAll('[data-k]').forEach(input=>{input.value=cue[input.dataset.k];input.addEventListener('input',()=>{cue[input.dataset.k]=input.type==='number'?Number(input.value):input.value;change()})});
row.querySelectorAll('[data-time]').forEach(button=>button.onclick=()=>{cue[button.dataset.time]=Math.round(audio.currentTime*1000)/1000;change();renderRows()});
row.querySelector('[data-play]').onclick=()=>{playUntil=cue.end;audio.currentTime=cue.start;audio.play()};row.querySelector('[data-remove]').onclick=()=>{state().cues.splice(i,1);change();renderRows()};el('rows').append(row)})}
function load(){current=data.videos.find(v=>v.videoId===el('clip').value);playUntil=null;if(saved[current.videoId]?.sourceAudioSha256!==current.audioSha256)delete saved[current.videoId];saved[current.videoId]??={videoId:current.videoId,sourceAudioSha256:current.audioSha256,cues:[{start:0,end:current.duration,zh:'',en:''}],chineseReviewed:false};audio.src=current.audio;el('title').textContent=current.title;el('raw').textContent=current.asrReference||'尚無可用辨識稿，請直接聽原音。';el('youtube').href='https://www.youtube.com/watch?v='+current.videoId;el('confirmed').checked=state().chineseReviewed;el('message').textContent='';renderRows();updateButtons()}
function validate(){if(!state().cues.length)throw Error('請至少保留一句。');let previous=-1;for(const c of state().cues){if(!Number.isFinite(c.start)||!Number.isFinite(c.end)||c.start<previous||c.start<0||c.end<=c.start||c.end>current.duration+.1)throw Error('請核對時間碼，需依序且位於片長內。');if(!c.zh.trim()||/待確認|待核對|聽不清楚/.test(c.zh))throw Error('請先確認每一句的中文原意，再標為已確認。');previous=c.end}}
function download(name,text,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
el('clip').onchange=load;el('slower').onclick=()=>audio.playbackRate=.8;el('normal').onclick=()=>audio.playbackRate=1;audio.ontimeupdate=()=>{el('clock').textContent=audio.currentTime.toFixed(3);if(playUntil!==null&&audio.currentTime>=playUntil){audio.pause();playUntil=null}};el('add').onclick=()=>{let end=state().cues.at(-1)?.end||0;state().cues.push({start:end,end:current.duration,zh:'',en:''});change();renderRows()};
el('confirmed').onchange=()=>{try{if(el('confirmed').checked)validate();state().chineseReviewed=el('confirmed').checked;store();updateButtons();el('message').textContent=''}catch(e){el('confirmed').checked=false;state().chineseReviewed=false;el('message').textContent=e.message;updateButtons()}};
el('export').onclick=()=>download('smartaction-caption-review.json',JSON.stringify({schemaVersion:1,spokenLanguages:['cmn-TW','nan-TW'],captions:Object.values(saved)},null,2),'application/json');
function exportSrt(language){try{validate();if(!state().chineseReviewed)throw Error('請先核對中文與時間碼。');if(!state().cues.every(c=>c[language].trim()))throw Error('請先補齊此語言的字幕。');download(current.videoId+'.'+(language==='zh'?'zh-Hant':'en')+'.srt',state().cues.map((c,i)=>`${i+1}\n${stamp(c.start)} --> ${stamp(c.end)}\n${c[language].trim()}`).join('\n\n')+'\n','text/plain;charset=utf-8')}catch(e){el('message').textContent=e.message}}
el('srt').onclick=()=>exportSrt('zh');el('english').onclick=()=>exportSrt('en');
fetch('review-data.json').then(r=>r.json()).then(d=>{data=d;d.videos.forEach(v=>{let option=document.createElement('option');option.value=v.videoId;option.textContent=v.title;el('clip').append(option)});load()}).catch(()=>el('message').textContent='請透過本機預覽網址開啟此頁。');
</script></body></html>
